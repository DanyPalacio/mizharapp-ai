services:
  - type: web
    name: mizhar-ai
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        fromService:
          type: web
          property: host
        scope: runtime
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: GOOGLE_TRENDS_API_KEY
        sync: false
      - key: CRUNCHBASE_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
    healthCheckPath: /
    maxInstances: 2
    minInstances: 1
    headers:
      - path: /.well-known/security.txt
        name: Content-Type
        value: text/plain
