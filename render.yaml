services:
  - type: web
    name: mizhar-ai
    env: node
    plan: starter
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        fromDatabase:
          name: mizhar_db
          property: connectionString
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
    healthCheckPath: /
    routes:
      - type: http
        path: /
        matchType: prefix

databases:
  - name: mizhar_db
    databaseName: mizhar_production
    user: mizhar_user
    region: ohio
    plan: starter
